name: Something's wrong
description: A bug, a crash, or AgentDeck not seeing or answering an agent.
labels: [bug, beta]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing AgentDeck. Please attach the **diagnostic bundle**: in the
        AgentDeck window, **Setup → Diagnostics → Export diagnostic bundle**, then drag
        the zip from your Downloads folder into the last box below. It holds versions,
        setup and which features work — no commands, code, prompts or file paths.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw. A screenshot of the island or window helps a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      placeholder: |
        1. Started a Claude Code session in a terminal
        2. Asked it to run …
        3. The island …
  - type: dropdown
    id: agents
    attributes:
      label: Which agent?
      multiple: true
      options: [Claude Code (terminal), Claude Code (desktop app), Codex (terminal), Codex (desktop app), Not about an agent]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: AgentDeck (Setup → Diagnostics), Claude Code / Codex, Windows 10 or 11.
      placeholder: AgentDeck 0.14.0 · Claude Code 2.1.286 · Windows 11
  - type: textarea
    id: bundle
    attributes:
      label: Diagnostic bundle
      description: Drag the AgentDeck-diagnostics-….zip here.
    validations:
      required: false
