name: Idea or feedback
description: Something that's confusing, missing, or that you'd change.
labels: [feedback, beta]
body:
  - type: textarea
    id: feedback
    attributes:
      label: What's on your mind?
      description: What you were trying to do, and what got in the way (or what you loved).
    validations:
      required: true
  - type: dropdown
    id: usage
    attributes:
      label: How often do you have AgentDeck running?
      options: [All day, Most days, Sometimes, I turned it off]
  - type: textarea
    id: off
    attributes:
      label: If you turned it off, why?
